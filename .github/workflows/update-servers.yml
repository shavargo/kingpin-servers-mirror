name: Update servers.txt

on:
  schedule:
    # Once a day around noon UTC
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from Hambloch
        run: |
          set -euo pipefail
          curl -fsSL \
            -A "kingpin-servers-mirror/1.0 (+https://github.com/shavargo/kingpin-servers-mirror)" \
            --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 60 \
            -o servers.txt.tmp \
            "https://hambloch.com/kingpin/servers_active.php?gameport=1"
          # Require at least a few address lines
          count="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:[0-9]+' servers.txt.tmp | wc -l | tr -d ' ')"
          echo "Parsed $count server addresses"
          test "$count" -ge 5
          {
            echo "# Mirrored from https://hambloch.com/kingpin/servers_active.php?gameport=1"
            echo "# Last fetch (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "#"
            cat servers.txt.tmp
          } > servers.txt
          rm -f servers.txt.tmp

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.txt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh servers.txt from hambloch.com"
          git push
