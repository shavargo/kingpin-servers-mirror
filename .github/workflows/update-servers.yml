name: Update servers.txt

on:
  schedule:
    # Once a day around noon UTC
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and merge server lists
        run: |
          set -euo pipefail
          python3 scripts/fetch_servers.py
          count="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:[0-9]+' servers.txt | wc -l | tr -d ' ')"
          echo "Merged address count: $count"
          test "$count" -ge 5

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.txt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh servers.txt from Hambloch + masters"
          git push
